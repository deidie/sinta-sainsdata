name: Cocokkan 6 Scopus Author ID ke Identitas Publik
on:
  workflow_dispatch:
  push:
    paths:
      - "uji_enam_scopus_author_id.py"
      - ".github/workflows/uji-enam-scopus-author-id.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Uji enam author ID tanpa mengarang publikasi
        run: python uji_enam_scopus_author_id.py
      - name: Simpan hasil audit profil
        run: |
          git add hasil/diagnostik_enam_author_id_scopus.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Cocokkan enam Scopus Author ID dan sumber identitas"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
