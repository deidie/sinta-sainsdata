name: Ambil publikasi semua dosen (GARUDA dan SINTA)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ambil-publikasi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ambil file repository
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ambil semua halaman publikasi enam dosen
        run: python cek_sinta.py

      - name: Simpan semua data dan laporan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-publikasi-enam-dosen
          path: hasil/
          if-no-files-found: warn
