name: Diagnostik Langsung Scholar GARUDA SINTA Scopus

on:
  push:
    paths:
      - ".github/workflows/diagnostik-live.yml"
      - "diagnostik_live.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostik:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Uji sumber publik tanpa mengubah data utama
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
        run: python diagnostik_live.py
      - name: Simpan hasil diagnostik di GitHub
        run: |
          git add hasil/diagnostik_live.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Simpan audit akses live Scholar GARUDA SINTA Scopus"
            git push
          fi
